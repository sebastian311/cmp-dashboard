<form (ngSubmit)="onSubmit(titleInput, requestInput)" #form>
    <app-control label="Name">
        <input name="name" id="title" #titleInput #input />
    </app-control>

    <app-control label="Request">
        <textarea name="request" id="request" rows="3" #requestInput #input ></textarea>
    </app-control>
    
    <p>
        <button appButton> 
            Submit <span class="icon">⌲</span>
        </button>
    </p>
</form>
