<app-header-component />

<main>
  <div id="dashboard">
    <app-dashboard-item [image]="{ src: 'status.png', alt: 'A signal symbol'}" [title]="'Server Status'" class="status-wrapper">
      <app-server-status />
    </app-dashboard-item>

    <app-dashboard-item [image]="{ src: 'globe.png', alt: 'A globe symbol'}" [title]="'Traffic'" class="traffic-wrapper">
      <app-traffic />
    </app-dashboard-item>

    <app-dashboard-item [image]="{ src: 'list.png', alt: 'A list of items'}" [title]="'Support Tickets'" class="tickets-wrapper">
      <app-tickets />
    </app-dashboard-item>
  </div>
</main>
